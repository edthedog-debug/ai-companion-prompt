name: Run AI Companion Check

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    - run: npm install
    - name: Test script execution
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: node server.js --version || true
